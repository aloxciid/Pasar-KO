<style>

/************************************************
 DATU SASAK MARKET
 STYLE.CSS
************************************************/

/*==========================
RESET
==========================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{

    scroll-behavior:smooth;

}

body{

    background:#161B22;

    color:#F1F1F1;

    font-family:
    "Segoe UI",
    Tahoma,
    Geneva,
    Verdana,
    sans-serif;

    overflow-x:hidden;

}


/*==========================
VARIABLE
==========================*/

:root{

    --bg:#161B22;

    --panel:#202938;

    --panel2:#2A3446;

    --gold:#D8B15A;

    --blue:#3A82F7;

    --green:#3CCB6C;

    --red:#E74C3C;

    --gray:#808B96;

    --white:#F5F5F5;

}


/*==========================
SCROLLBAR
==========================*/

::-webkit-scrollbar{

    width:10px;

}

::-webkit-scrollbar-track{

    background:#111;

}

::-webkit-scrollbar-thumb{

    background:var(--gold);

    border-radius:20px;

}

::-webkit-scrollbar-thumb:hover{

    background:#F4D06F;

}


/*==========================
LOADING
==========================*/

.loading{

    position:fixed;

    inset:0;

    background:#161B22;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    z-index:99999;

}

.loader{

    width:70px;

    height:70px;

    border:6px solid #333;

    border-top:6px solid var(--gold);

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin-bottom:20px;

}

@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}


/*==========================
HEADER
==========================*/

.header{

    width:100%;

    background:var(--panel);

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px 30px;

    box-shadow:0 0 15px rgba(0,0,0,.35);

    position:sticky;

    top:0;

    z-index:999;

}

.logo{

    display:flex;

    align-items:center;

    gap:15px;

}

.logo-icon{

    font-size:42px;

}

.logo h1{

    font-size:24px;

    color:var(--gold);

}

.logo small{

    color:#BBBBBB;

}


/*==========================
SEARCH
==========================*/

.search-box{

    width:350px;

}

.search-box input{

    width:100%;

    padding:12px 16px;

    border:none;

    outline:none;

    border-radius:12px;

    background:#111827;

    color:white;

    transition:.3s;

}

.search-box input:focus{

    box-shadow:0 0 10px var(--gold);

}


/*==========================
NAVBAR
==========================*/

.navbar{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    justify-content:center;

    background:#202938;

    padding:15px;

    border-bottom:1px solid rgba(255,255,255,.05);

}

.nav-btn{

    background:#2A3446;

    color:white;

    border:none;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;

    transition:.25s;

    font-size:14px;

    font-weight:bold;

}

.nav-btn:hover{

    background:var(--gold);

    color:#111;

}

.nav-btn.active{

    background:var(--gold);

    color:#111;

}


/*==========================
APP
==========================*/

#app{

    width:95%;

    max-width:1450px;

    margin:35px auto;

}


/*==========================
FOOTER
==========================*/

footer{

    margin-top:60px;

    background:#111827;

    padding:40px;

    text-align:center;

}

footer h3{

    color:var(--gold);

    margin-bottom:12px;

}

.footer-links{

    margin-top:18px;

    display:flex;

    justify-content:center;

    gap:18px;

    flex-wrap:wrap;

}

.footer-links a{

    color:#AAA;

    text-decoration:none;

}

.footer-links a:hover{

    color:var(--gold);

}


/*==========================
MODAL
==========================*/

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

.modal-content{

    width:90%;

    max-width:900px;

    max-height:90vh;

    overflow-y:auto;

    background:#222D3F;

    border-radius:16px;

    padding:30px;

    position:relative;

}

.modal-content img{

    display:block;

    max-width:100%;

    height:auto;

}

@keyframes fade{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

#closeModal{

    position:absolute;

    right:18px;

    top:15px;

    font-size:30px;

    cursor:pointer;

}

/*====================================================
HOME DASHBOARD
====================================================*/

.dashboard{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));

    gap:20px;

    margin-bottom:35px;

}

.dashboard-card{

    background:var(--panel);

    border:1px solid rgba(255,255,255,.08);

    border-radius:15px;

    padding:25px;

    transition:.3s;

    text-align:center;

}

.dashboard-card:hover{

    transform:translateY(-5px);

    border-color:var(--gold);

    box-shadow:0 0 20px rgba(216,177,90,.25);

}

.dashboard-card h2{

    color:var(--gold);

    font-size:18px;

}

.dashboard-card h1{

    margin-top:10px;

    font-size:36px;

}

/*====================================================
GRID PRODUK
====================================================*/

.grid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));

    gap:25px;

}

/*====================================================
CARD
====================================================*/

.card{

    background:var(--panel);

    border-radius:15px;

    overflow:hidden;

    transition:.3s;

    cursor:pointer;

    border:1px solid rgba(255,255,255,.05);

}

.card:hover{

    transform:translateY(-8px);

    box-shadow:0 12px 30px rgba(0,0,0,.4);

    border-color:var(--gold);

}

.card-image{

    width:100%;

    height:230px;

    overflow:hidden;

    background:#10151f;

}

.card-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:.4s;

}

.card:hover img{

    transform:scale(1.08);

}

.card-body{

    padding:18px;

}

.card-title{

    color:var(--gold);

    font-size:19px;

    margin-bottom:10px;

}

.card-info{

    margin:6px 0;

    color:#ccc;

    font-size:14px;

}

.card-price{

    margin-top:15px;

    color:#50fa7b;

    font-size:22px;

    font-weight:bold;

}

/*====================================================
BADGE
====================================================*/

.badge{

    display:inline-block;

    padding:6px 12px;

    border-radius:30px;

    font-size:12px;

    font-weight:bold;

    margin-top:15px;

}

.ready{

    background:#2ecc71;

    color:white;

}

.not-ready{

    background:#e74c3c;

    color:black;

}

.sold{

    background:#e74c3c;

    color:white;

}

.booked{

    background:#f39c12;

    color:white;

}

/*====================================================
BUTTON
====================================================*/

.btn{

    border:none;

    cursor:pointer;

    border-radius:10px;

    padding:12px 18px;

    transition:.25s;

    font-weight:bold;

}

.btn-primary{

    background:var(--gold);

    color:#111;

}

.btn-primary:hover{

    transform:scale(1.05);

}

.btn-danger{

    background:#e74c3c;

    color:white;

}

/*====================================================
TABLE
====================================================*/

.table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

    background:var(--panel);

    border-radius:15px;

    overflow:hidden;

}

.table thead{

    background:var(--gold);

    color:#111;

}

.table th{

    padding:15px;

    text-align:left;

}

.table td{

    padding:15px;

    border-bottom:1px solid rgba(255,255,255,.05);

}

.table tbody tr{

    transition:.2s;

}

.table tbody tr:hover{

    background:#2d3748;

}

/*====================================================
PAGINATION
====================================================*/

.pagination{

    display:flex;

    justify-content:center;

    gap:10px;

    margin:40px 0;

}

.pagination button{

    border:none;

    background:var(--panel2);

    color:white;

    padding:10px 15px;

    cursor:pointer;

    border-radius:10px;

}

.pagination button:hover{

    background:var(--gold);

    color:#111;

}

/*====================================================
EMPTY DATA
====================================================*/

.empty{

    padding:60px;

    text-align:center;

    color:#999;

    font-size:18px;

}

/*====================================================
RESPONSIVE
====================================================*/

@media(max-width:900px){

.header{

    flex-direction:column;

    gap:15px;

}

.search-box{

    width:100%;

}

.logo{

    justify-content:center;

}

}

@media(max-width:700px){

.navbar{

    overflow-x:auto;

    justify-content:flex-start;

}

.nav-btn{

    white-space:nowrap;

}


/* UBAH INI */
.grid{

    grid-template-columns:repeat(2,1fr);

    gap:10px;

}


.table{

    display:block;

    overflow-x:auto;

}


.card-image{

    height:130px;

}

}

@media(max-width:500px){

.logo h1{

    font-size:18px;

}

.logo small{

    font-size:12px;

}

.dashboard{

    grid-template-columns:1fr;

}

.card-title{

    font-size:16px;

}

.card-price{

    font-size:18px;

}

}

.fa-whatsapp{
    font-size:24px;
    color:#25D366;
    transition:.3s;
}

.fa-whatsapp:hover{
    color:#1ebe5d;
    transform:scale(1.2);
}

.fa-facebook{
    font-size:24px;
    color:#1877F2;
    transition:.3s;
}

.fa-facebook:hover{
    color:#0d5ecf;
    transform:scale(1.2);
}

/*====================================================
MOBILE OPTIMIZATION
====================================================*/


@media(max-width:700px){


    #app{

        width:100%;

        padding:10px;

        margin:15px auto;

    }


    .header{

        padding:15px;

        flex-direction:column;

        gap:12px;

    }


    .logo{

        width:100%;

        justify-content:center;

        text-align:center;

    }


    .logo-icon{

        font-size:32px;

    }


    .logo h1{

        font-size:20px;

    }


    .search-box{

        width:100%;

    }



    /* NAV MOBILE */

    .navbar{

        padding:10px;

        display:flex;

        overflow-x:auto;

        gap:8px;

        justify-content:flex-start;

    }


    .nav-btn{

        flex-shrink:0;

        padding:10px 14px;

        font-size:13px;

    }



    /* DASHBOARD */

    .dashboard{

        grid-template-columns:repeat(2,1fr);

        gap:10px;

    }


    .dashboard-card{

        padding:15px 10px;

    }


    .dashboard-card h1{

        font-size:25px;

    }



    /* MARKET GRID */

    .grid{

        grid-template-columns:repeat(2,1fr);

        gap:10px;

    }



    /* CARD */

    .card{

        border-radius:12px;

    }


    .card-image{

        height:130px;

    }


    .card-body{

        padding:12px;

    }


    .card-title{

        font-size:14px;

        height:35px;

        overflow:hidden;

    }


    .card-info{

        font-size:12px;

    }


    .card-price{

        font-size:16px;

    }


    .badge{

        font-size:10px;

        padding:5px 8px;

    }


    .btn{

        width:100%;

        padding:10px;

        font-size:13px;

    }



    /* MODAL */

    .modal-content{

        width:95%;

        padding:20px;

        max-height:90vh;

        overflow:auto;

    }


}



@media(max-width:400px){


    .grid{

        gap:8px;

    }


    .card-image{

        height:110px;

    }


    .dashboard{

        grid-template-columns:1fr;

    }

}

/*====================================================
MOBILE UI V2
====================================================*/

@media screen and (max-width:768px){

    body{
        font-size:14px;
    }

    /* Header */
    .header{
        flex-direction:column;
        align-items:stretch;
        padding:15px;
        gap:15px;
    }

    .logo{
        justify-content:center;
        text-align:center;
    }

    .logo h1{
        font-size:22px;
    }

    .logo small{
        display:block;
        margin-top:5px;
    }

    /* Search */
    .search-box{
        width:100%;
    }

    .search-box input{
        height:45px;
        font-size:15px;
    }

    /* Navbar */
    .navbar{
        display:flex;
        flex-wrap:nowrap;
        overflow-x:auto;
        gap:8px;
        padding:10px;
        justify-content:flex-start;

        scrollbar-width:none;
    }

    .navbar::-webkit-scrollbar{
        display:none;
    }

    .nav-btn{
        flex:0 0 auto;
        padding:10px 16px;
        font-size:13px;
    }

    /* App */
    #app{
        width:100%;
        padding:10px;
        margin:15px auto;
    }

    /* Dashboard */
    .dashboard{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .dashboard-card{
        padding:18px 10px;
    }

    .dashboard-card h2{
        font-size:15px;
    }

    .dashboard-card h1{
        font-size:28px;
    }

    /* Grid Produk */
    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card{
        border-radius:12px;
    }

    .card-image{
        height:140px;
    }

    .card-body{
        padding:12px;
    }

    .card-title{
        font-size:15px;
    }

    .card-info{
        font-size:12px;
    }

    .card-price{
        font-size:16px;
    }

    .badge{
        font-size:11px;
        padding:5px 10px;
    }

    /* Table */
    .table{
        display:block;
        overflow-x:auto;
        white-space:nowrap;
    }

    /* Modal */
    .modal-content{
        width:95%;
        padding:20px;
    }

    /* Footer */
    footer{
        padding:25px 15px;
    }

    .footer-links{
        flex-direction:column;
        gap:10px;
    }

}

/*=========================================
PAGE LOADING
=========================================*/

.loading-page{

    min-height:350px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

}

.loading-page h2{

    margin-top:20px;

    color:var(--gold);

}

.loading-page p{

    margin-top:8px;

    color:#bbb;

}

.card-action{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:15px;

}

.btn-buy{

    background:#25D366;

    color:white;

    padding:8px 14px;

    border-radius:8px;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;

}

.btn-buy:hover{

    background:#1da851;

}

.card-action{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.btn-buy{
    background:#25D366;
    color:white;
    border:none;
    border-radius:8px;
    padding:6px 14px;
    cursor:pointer;
    font-weight:bold;
}

.btn-buy:hover{
    opacity:.9;
}

.footer-contact{
    text-align:center;
    margin-top:15px;
    font-size:15px;
}

.footer-contact a{
    color:#ffd54f;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

.footer-contact a:hover{
    color:#ffffff;
    text-decoration:underline;
}

.footer-contact span{
    color:#aaa;
    margin:0 8px;
}
</style>
